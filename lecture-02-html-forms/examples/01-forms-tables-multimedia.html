<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Forms — Examples</title>
</head>
<body>

  <h1>HTML5 Form Elements</h1>

  <!-- ===== BASIC FORM WITH FIELDSETS ===== -->
  <form action="/submit" method="POST">
    <fieldset>
      <legend>Personal Information</legend>

      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Alice Smith" required>
      <br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <br>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob">
      <br>

      <label for="gender">Gender:</label>
      <select id="gender" name="gender">
        <option value="">-- Select --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Prefer not to say</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Preferences</legend>

      <label>Interests:</label>
      <input type="checkbox" id="coding" name="interests" value="coding">
      <label for="coding">Coding</label>
      <input type="checkbox" id="design" name="interests" value="design">
      <label for="design">Design</label>
      <br>

      <label>Skill Level:</label>
      <input type="radio" id="beginner" name="level" value="beginner">
      <label for="beginner">Beginner</label>
      <input type="radio" id="intermediate" name="level" value="intermediate">
      <label for="intermediate">Intermediate</label>
      <br>

      <label for="range">Experience (years):</label>
      <input type="range" id="range" name="experience" min="0" max="20" step="1">
    </fieldset>

    <fieldset>
      <legend>Message</legend>
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4" cols="50" placeholder="Your message..."></textarea>
    </fieldset>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>

  <!-- ===== HTML TABLES ===== -->
  <h2>HTML Table Example</h2>
  <table border="1">
    <caption>Course Schedule</caption>
    <thead>
      <tr>
        <th>Week</th>
        <th>Topic</th>
        <th>Type</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>HTML5 Basics</td>
        <td>Theory + Lab</td>
      </tr>
      <tr>
        <td>2</td>
        <td>CSS Fundamentals</td>
        <td>Theory + Lab</td>
      </tr>
      <tr>
        <td rowspan="2">3</td>
        <td>JavaScript Basics</td>
        <td>Theory</td>
      </tr>
      <tr>
        <td>JS Lab</td>
        <td>Lab</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">48 Lectures Total</td>
      </tr>
    </tfoot>
  </table>

  <!-- ===== MULTIMEDIA ===== -->
  <h2>Multimedia Elements</h2>

  <!-- Video with multiple sources and fallback -->
  <video width="400" controls poster="thumbnail.jpg">
    <source src="video.mp4" type="video/mp4">
    <source src="video.webm" type="video/webm">
    Your browser does not support the video element.
  </video>

  <!-- Audio -->
  <audio controls>
    <source src="audio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Responsive image with figure/figcaption -->
  <figure>
    <img src="https://via.placeholder.com/600x300" alt="Landscape placeholder">
    <figcaption>Figure 1: An example image with a caption.</figcaption>
  </figure>

</body>
</html>
