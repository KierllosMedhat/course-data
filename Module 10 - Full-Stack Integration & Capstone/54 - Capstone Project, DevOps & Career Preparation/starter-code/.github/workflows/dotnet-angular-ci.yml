name: Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore backend/ShopAPI.csproj

    - name: Build Backend (Release)
      run: dotnet build backend/ShopAPI.csproj --no-restore --configuration Release

    - name: Run Backend Tests
      run: dotnet test backend/ShopAPI.csproj --no-build --verbosity normal

  frontend-ci:
    name: Frontend CI (Angular 21)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # LTS version recommended for Angular 21

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint Angular Code
      run: |
        cd frontend
        npm run lint --if-present

    - name: Build Angular for Production
      run: |
        cd frontend
        npm run build --configuration=production
