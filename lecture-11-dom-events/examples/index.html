<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Manipulation & Events</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .box { width: 100px; height: 100px; background: lightblue; margin: 10px 0; transition: background 0.3s; }
    .highlight { background: gold; border: 2px solid orange; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1 id="main-title">DOM Exploration</h1>
  
  <p class="text">This is paragraph 1.</p>
  <p class="text">This is paragraph 2.</p>

  <div class="box" id="interactive-box"></div>

  <button id="toggle-btn">Toggle Highlight</button>
  <button id="add-item-btn">Add List Item</button>

  <ul id="item-list">
    <li>Initial Item 1</li>
    <li>Initial Item 2</li>
  </ul>

  <!-- Form for event delegation example -->
  <form id="my-form">
    <input type="text" id="name-input" placeholder="Enter your name">
    <button type="submit">Submit</button>
  </form>

  <script src="01-dom-events.js"></script>
</body>
</html>
