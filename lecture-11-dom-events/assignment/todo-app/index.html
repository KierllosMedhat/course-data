<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TODO App</title>
  <style>
    /* Basic styling to get started */
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    input[type="text"] { width: 70%; padding: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ccc; }
    .completed { text-decoration: line-through; color: #888; }
    .delete-btn { background: #ff4444; color: white; border: none; padding: 4px 8px; }
  </style>
</head>
<body>

  <!-- ASSIGNMENT — DOM Manipulation Todo App -->
  <!-- See app.js for requirements -->

  <h1>My Tasks</h1>
  
  <form id="todo-form">
    <input type="text" id="task-input" placeholder="Add a new task...">
    <button type="submit">Add Task</button>
  </form>

  <ul id="task-list">
    <!-- Tasks will be injected here by JS -->
  </ul>

  <script src="app.js"></script>
</body>
</html>
