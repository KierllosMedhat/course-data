<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 1 - Advanced Multi-State Animated Modal</title>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom tailwind v4 @theme simulation via CDN style tag -->
  <style type="text/tailwindcss">
    @theme {
      /* TODO: Step 1: Define scale-up-fade animation */
      /* Hint: scaleUpFade should go from scale 0.95 & opacity 0 to scale 1 & opacity 1 */
      --animate-scale-up-fade: scaleUpFade 0.2s ease-out forwards;

      @keyframes scaleUpFade {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 transition-colors duration-300 flex items-center justify-center min-h-screen">

  <div class="text-center">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">Animated Modal Lab</h1>
    
    <!-- Trigger Button -->
    <button id="openModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition active:scale-95">
      Open Modal
    </button>
  </div>

  <!-- TODO: Step 2: The Backdrop Setup -->
  <!-- Requirements: hidden by default, fixed, full-screen, z-50, backdrop-blur-sm, bg-black/60 -->
  <div id="modalBackdrop" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    
    <!-- TODO: Step 3: The Modal Box -->
    <!-- Requirements: bg-white dark:bg-slate-800 rounded-2xl shadow-2xl animate-scale-up-fade, max-width -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-6 relative animate-scale-up-fade">
      
      <!-- TODO: Step 4: Interactive Close Button (Using group modifier to rotate SVG on hover) -->
      <button id="closeModalBtn" class="group absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
        <svg class="w-6 h-6 transform transition-transform duration-300 group-hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Modal Header -->
      <div class="mb-4">
        <h3 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
          <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          System Update
        </h3>
      </div>

      <!-- Modal Body -->
      <div class="mb-6">
        <p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed">
          A new software update is available for your device. This update includes stability fixes, security patches, and performance optimizations.
        </p>
      </div>

      <!-- TODO: Step 5: The Footer Actions (With accessible focus states) -->
      <div class="flex justify-end gap-3">
        <button id="cancelBtn" class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 transition font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          Cancel
        </button>
        <button id="confirmBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          Install Now
        </button>
      </div>

    </div>
  </div>

  <!-- JS to handle modal visibility toggle -->
  <script>
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const backdrop = document.getElementById('modalBackdrop');

    function toggleModal() {
      backdrop.classList.toggle('hidden');
    }

    openBtn.addEventListener('click', toggleModal);
    closeBtn.addEventListener('click', toggleModal);
    cancelBtn.addEventListener('click', toggleModal);

    // Close on backdrop click
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) toggleModal();
    });
  </script>
</body>
</html>
