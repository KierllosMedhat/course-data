  <!-- Dashboard Container -->
  <div class="container my-4">
    
    <!-- TODO: Step 2 - Row 1: 4 Stats Cards -->
    <!-- Grid rule: Needs col-6 col-md-3 on each column for responsive sizing (2 per row on mobile, 4 on desktop) -->
    <!-- All cards should have equal height (use class 'h-100' on the card) -->
    <div class="row g-4 mb-4">
      <!-- Card 1: Users -->
      <div class="col-6 col-md-3">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">
            <!-- TODO: Add dynamic icon, count (e.g. 1,245) and label (e.g. Total Users) -->
          </div>
        </div>
      </div>
      <!-- Card 2: Revenue -->
      <div class="col-6 col-md-3">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">

          </div>
        </div>
      </div>
      <!-- Card 3: Orders -->
      <div class="col-6 col-md-3">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">
            <!-- TODO: Add order details -->
          </div>
        </div>
      </div>
      <!-- Card 4: Growth -->
      <div class="col-6 col-md-3">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">
            <!-- TODO: Add growth details -->
          </div>
        </div>
      </div>
    </div>

    <!-- TODO: Step 2 - Row 2: Main Chart Area + Sidebar -->
    <!-- Grid rule: Main Chart should be col-lg-8, Sidebar should be col-lg-4 -->
    <div class="row g-4 mb-4">
      <!-- Main Content Area -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title fw-bold">Sales Overview</h5>
            <p class="text-muted">Interactive chart would go here.</p>
            <!-- TODO: Create a placeholder container for the chart -->

        </div>
      </div>
      
      <!-- Sidebar Area -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title fw-bold">Recent Activities</h5>

      </div>

    <!-- TODO: Step 2 - Row 3: Full-width Data Table Section -->

          <div class="card-body">
