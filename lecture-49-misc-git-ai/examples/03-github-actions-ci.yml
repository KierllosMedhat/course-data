name: Full-Stack CI Pipeline

# This workflow runs automatically whenever you push code to the 'main' branch
# or open a Pull Request against the 'main' branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    name: Build & Test ASP.NET Core
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./backend/ShopAPI.sln
      
    - name: Build
      run: dotnet build ./backend/ShopAPI.sln --no-restore --configuration Release
      
    - name: Run Tests
      run: dotnet test ./backend/ShopAPI.Tests/ShopAPI.Tests.csproj --no-build --verbosity normal

  build-and-test-frontend:
    name: Build & Test Angular
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run Linter
      working-directory: ./frontend
      run: npm run lint
      
    - name: Build Angular Project
      working-directory: ./frontend
      run: npm run build -- --configuration production
