<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Lab</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center">
    
    <button id="openModal" class="bg-blue-600 text-white px-6 py-3 rounded shadow hover:bg-blue-700">Open Modal</button>

    <!-- Modal Backdrop (Hidden by default using hidden class) -->
    <!-- TODO: Style the backdrop so it covers the whole screen, has a black semi-transparent background, and blurs the background -->
    <div id="modalBackdrop" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center">
        
        <!-- Modal Content -->
        <!-- TODO: Style the modal box so it's white, rounded, shadowed, and animated (scale up on appear) -->
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full">
            <h2 class="text-2xl font-bold mb-4">Hello!</h2>
            <p class="text-gray-600 mb-6">This is an accessible modal built with Tailwind CSS.</p>
            <div class="flex justify-end">
                <button id="closeModal" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">Close</button>
            </div>
        </div>
        
    </div>

    <script>
        const backdrop = document.getElementById('modalBackdrop');
        const openBtn = document.getElementById('openModal');
        const closeBtn = document.getElementById('closeModal');

        openBtn.addEventListener('click', () => backdrop.classList.remove('hidden'));
        closeBtn.addEventListener('click', () => backdrop.classList.add('hidden'));

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') backdrop.classList.add('hidden');
        });
    </script>
</body>
</html>
