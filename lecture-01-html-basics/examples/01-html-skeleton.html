<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Document Structure</title>
</head>
<body>

  <!-- ===== SEMANTIC LAYOUT ===== -->
  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>This is a paragraph describing who I am.</p>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <ul>
        <li>HTML5</li>
        <li>CSS3</li>
        <li>JavaScript</li>
      </ul>
    </section>

    <article>
      <h2>Blog Post Title</h2>
      <p>A self-contained article (blog post, news story, etc.).</p>
    </article>

    <aside>
      <h3>Related Links</h3>
      <p>Sidebar content — related information.</p>
    </aside>
  </main>

  <footer id="contact">
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
