<div class="blog-container">
  <h2>Lab 1: Typed Blog Reader</h2>

  <!-- TODO: Implement modern Angular control flow to handle the 3 resource states -->
  
  <!-- State 1: Loading -->
  @if (postsResource.isLoading()) {
    <div class="loading-state">
      <p>Loading posts... Please wait.</p>
    </div>
  }
  
  <!-- State 2: Error -->
  @else if (postsResource.error()) {
    <div class="error-state">
      <p><strong>Error:</strong> Failed to fetch posts.</p>
      <!-- Optional: Show actual error info: {{ postsResource.error() }} -->
      <button class="btn btn-retry" (click)="postsResource.reload()">Try Again</button>
    </div>
  }
  
  <!-- State 3: Success Data Grid -->
  @else {
    <div class="posts-grid">
      @for (post of postsResource.value(); track post.id) {
        <div class="post-card">
          <span class="post-id">Post #{{ post.id }}</span>
          <h3>{{ post.title }}</h3>
          <p>{{ post.body }}</p>
        </div>
      }
    </div>
  }
</div>
