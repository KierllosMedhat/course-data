<div class="table-container mat-elevation-z8">
  <h2>Lab 2: User Directory Data Table</h2>

  <!-- Filter Input Field -->
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Search Users</mat-label>
    <!-- TODO: Bind the keyup event to trigger applyFilter() -->
    <input matInput (keyup)="applyFilter($event)" placeholder="e.g. Alice, Admin" #input />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- TODO: Set up the mat-table with matSort directive -->
  <table mat-table [dataSource]="dataSource" matSort class="full-width-table">
    
    <!-- ID Column -->
    <!-- TODO: Add mat-sort-header to make this column sortable -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let user"> {{ user.id }} </td>
    </ng-container>

    <!-- Name Column -->
    <!-- TODO: Add mat-sort-header to make this column sortable -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
    </ng-container>

    <!-- Email Column -->
    <!-- TODO: Add mat-sort-header to make this column sortable -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
    </ng-container>

    <!-- Role Column -->
    <!-- TODO: Add mat-sort-header to make this column sortable -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Role </th>
      <td mat-cell *matCellDef="let user">
        <span class="role-badge" [ngClass]="user.role.toLowerCase()">
          {{ user.role }}
        </span>
      </td>
    </ng-container>

    <!-- Row definitions -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter: "{{ input.value }}"</td>
    </tr>
  </table>

  <!-- TODO: Set up the mat-paginator with page sizes [5, 10, 25] -->
  <mat-paginator 
    [pageSizeOptions]="[5, 10, 25]" 
    showFirstLastButtons
    aria-label="Select page of users"
  ></mat-paginator>
</div>
