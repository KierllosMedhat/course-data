<div class="survey-container">
  <h2>Lab 2: Dynamic Survey Builder</h2>

  <form [formGroup]="surveyForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="title">Survey Title</label>
      <input 
        type="text" 
        id="title" 
        formControlName="title" 
        class="form-control" 
        placeholder="Enter Survey Title"
      />
      <div *ngIf="surveyForm.get('title')?.invalid && surveyForm.get('title')?.touched" class="error-msg">
        Title is required.
      </div>
    </div>

    <hr />

    <h3>Questions</h3>
    
    <!-- Bind formArrayName to "questions" -->
    <div formArrayName="questions">
      <div 
        *ngFor="let question of questions.controls; let i = index" 
        [formGroupName]="i" 
        class="question-card"
      >
        <div class="question-header">
          <h4>Question #{{ i + 1 }}</h4>
          <button type="button" class="btn btn-danger btn-sm" (click)="removeQuestion(i)">
            Remove
          </button>
        </div>

        <div class="form-group">
          <label>Question Text</label>
          <input 
            type="text" 
            formControlName="questionText" 
            class="form-control" 
            placeholder="e.g. What is your name?"
          />
          <div *ngIf="question.get('questionText')?.invalid && question.get('questionText')?.touched" class="error-msg">
            Question text is required.
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-half">
            <label>Answer Type</label>
            <select formControlName="answerType" class="form-control">
              <option value="Text">Text</option>
              <option value="Number">Number</option>
              <option value="Boolean">Boolean</option>
            </select>
          </div>

          <div class="form-group col-half check-container">
            <label>
              <input type="checkbox" formControlName="isRequired" />
              Required Field
            </label>
          </div>
        </div>

        <!-- TODO: Dynamic conditional control. Show only if answerType is 'Number' -->
        <!-- Hint: Check if control 'maxValue' exists on this question group -->
        <div *ngIf="question.get('maxValue')" class="form-group">
          <label>Max Value Limit</label>
          <input 
            type="number" 
            formControlName="maxValue" 
            class="form-control" 
            placeholder="e.g. 100"
          />
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button type="button" class="btn btn-secondary" (click)="addQuestion()">
        + Add Question
      </button>
      
      <button type="submit" [disabled]="surveyForm.invalid" class="btn btn-primary">
        Submit Survey
      </button>
    </div>
  </form>
</div>
