name: .NET Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test Application
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # TODO: Restore project dependencies using dotnet restore
    - name: Restore Dependencies
      run: dotnet restore

    # TODO: Build solution using dotnet build
    - name: Build Application
      run: dotnet build --no-restore -c Release

    # TODO: Run unit and integration tests using dotnet test on every Pull Request
    - name: Run Unit & Integration Tests
      run: dotnet test --no-build -c Release --verbosity normal

  docker_build_and_push:
    name: Build & Push Docker Image
    needs: build_and_test 
    runs-on: ubuntu-latest
    
    # TODO: Restrict the deploy job to only run when code is pushed to main
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # TODO: Setup Docker login using docker/login-action
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }} 
        password: ${{ secrets.DOCKER_PASSWORD }}

    # TODO: Build and push AOT Docker Image using docker/build-push-action
    - name: Build and Push AOT Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/shopapi:latest
          ${{ secrets.DOCKER_USERNAME }}/shopapi:${{ github.sha }}
