<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flip Card Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <!-- Front of the card -->
            <div class="card-front">
                <h2>Product XYZ</h2>
                <p>Hover to see details!</p>
            </div>
            
            <!-- Back of the card -->
            <div class="card-back">
                <h2>Details</h2>
                <ul>
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                </ul>
                <button>Buy Now</button>
            </div>
        </div>
    </div>
</body>
</html>
