<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Nav Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="#" class="nav__link">Home</a>
            <div class="nav__item--dropdown">
                <a href="#" class="nav__link">Services</a>
                <!-- Dropdown menu -->
                <div class="nav__dropdown-content">
                    <a href="#">Web Design</a>
                    <a href="#">SEO</a>
                </div>
            </div>
            <a href="#" class="nav__link">Contact</a>
        </nav>
    </header>
    
    <main class="content">
        <h1>Scroll Down</h1>
        <p>Keep scrolling to see the navbar stick to the top!</p>
        <div style="height: 2000px; background: linear-gradient(#eee, #aaa);"></div>
    </main>
</body>
</html>
