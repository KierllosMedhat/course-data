<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Only Modal</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; }
        
        .modal {
            /* TODO: Make this overlay cover the entire screen using fixed positioning */
            display: none;
            background: rgba(0,0,0,0.5);
        }

        .modal:target {
            display: block;
        }

        .modal__content {
            /* TODO: Center this box absolutely/fixed within the modal overlay */
            background: white;
            padding: 2rem;
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <a href="#myModal">Open CSS Modal</a>

    <!-- The Modal -->
    <div id="myModal" class="modal">
        <div class="modal__content">
            <h2>Hello!</h2>
            <p>This modal works without JS.</p>
            <a href="#">Close</a>
        </div>
    </div>

</body>
</html>
