<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS - Utility-First Fundamentals</title>
  <!-- Tailwind CSS via CDN (for development only) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-8">

  <div class="max-w-4xl mx-auto space-y-12">
    
    <!-- 1. TEXT & COLOURS -->
    <section>
      <h2 class="text-3xl font-bold text-blue-600 mb-4">Typography & Colours</h2>
      <p class="text-lg text-gray-600 leading-relaxed">
        Tailwind uses descriptive utility classes like <code class="bg-gray-200 px-1 rounded text-sm text-pink-500">text-blue-600</code> and <code class="bg-gray-200 px-1 rounded text-sm text-pink-500">font-bold</code> to style text directly in your HTML.
      </p>
    </section>

    <!-- 2. SPACING & SIZING -->
    <section>
      <h2 class="text-2xl font-semibold mb-4">Spacing & Sizing</h2>
      <div class="flex space-x-4">
        <!-- p-4 = padding 1rem, w-32 = width 8rem, h-32 = height 8rem -->
        <div class="bg-indigo-500 p-4 w-32 h-32 text-white flex items-center justify-center rounded-lg shadow-md">
          Box 1
        </div>
        <div class="bg-purple-500 p-8 w-40 h-40 text-white flex items-center justify-center rounded-full shadow-lg">
          Box 2
        </div>
      </div>
    </section>

    <!-- 3. FLEXBOX & GRID -->
    <section>
      <h2 class="text-2xl font-semibold mb-4">Flexbox & Grid</h2>
      
      <!-- Flexbox -->
      <h3 class="text-xl font-medium mb-2">Flex Row</h3>
      <div class="flex items-center justify-between bg-white p-4 rounded shadow mb-6">
        <div class="text-gray-700 font-medium">Brand</div>
        <div class="space-x-4">
          <a href="#" class="text-blue-500 hover:text-blue-700">Link 1</a>
          <a href="#" class="text-blue-500 hover:text-blue-700">Link 2</a>
        </div>
      </div>

      <!-- CSS Grid -->
      <h3 class="text-xl font-medium mb-2">Grid Layout</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">Card 1</div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">Card 2</div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">Card 3</div>
      </div>
    </section>

    <!-- 4. HOVER, FOCUS, AND STATES -->
    <section>
      <h2 class="text-2xl font-semibold mb-4">States & Transitions</h2>
      <button class="bg-blue-600 text-white px-6 py-2 rounded-md font-medium hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-colors duration-200">
        Click Me
      </button>
      <input type="text" placeholder="Focus me..." class="mt-4 block w-full border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-4 py-2 border">
    </section>

  </div>

</body>
</html>
